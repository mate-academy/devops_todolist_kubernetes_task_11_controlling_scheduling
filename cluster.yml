# this config file contains all config fields with comments
# NOTE: this is not a particularly useful config file
apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
# patch the generated kubeadm config with some extra settings
kubeadmConfigPatches:
- |
  apiVersion: kubelet.config.k8s.io/v1beta1
  kind: KubeletConfiguration
  evictionHard:
    nodefs.available: "0%"
# NOTE: removed deprecated kubeadm v1beta3 JSON6902 patch to avoid kubeadm API warnings
# 2 control plane node and 2 workers
nodes:
# the control plane node config
- role: control-plane
  image: kindest/node:v1.34.3
  extraMounts:
    - hostPath: /tmp
      containerPath: /data
  kubeadmConfigPatches:
  - |
    apiVersion: kubeadm.k8s.io/v1beta3
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "ingress-ready=true"
  extraPortMappings:
  - containerPort: 30007
    hostPort: 30007
  - containerPort: 30008
    hostPort: 30008
  - containerPort: 80
    hostPort: 80
    protocol: TCP
  - containerPort: 443
    hostPort: 443
    protocol: TCP
# the two workers
- role: worker
  image: kindest/node:v1.34.3
  extraMounts:
    - hostPath: /tmp
      containerPath: /data
  labels:
    app: mysql
- role: worker
  image: kindest/node:v1.34.3
  extraMounts:
    - hostPath: /tmp
      containerPath: /data
  labels:
    app: mysql
- role: worker
  image: kindest/node:v1.34.3
  extraMounts:
    - hostPath: /tmp
      containerPath: /data
  labels:
    app: todoapp
- role: worker
  image: kindest/node:v1.34.3
  extraMounts:
    - hostPath: /tmp
      containerPath: /data
  labels:
    app: todoapp
- role: worker
  image: kindest/node:v1.34.3
  extraMounts:
    - hostPath: /tmp
      containerPath: /data
  labels:
    app: todoapp
- role: worker
  image: kindest/node:v1.34.3
  extraMounts:
    - hostPath: /tmp
      containerPath: /data
