# this config file contains all config fields with comments
# NOTE: this is not a particularly useful config file
apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
# patch the generated kubeadm config with some extra settings
kubeadmConfigPatches:
- |
  apiVersion: kubelet.config.k8s.io/v1beta1
  kind: KubeletConfiguration
  evictionHard:
    nodefs.available: "0%"
# patch it further using a JSON 6902 patch
kubeadmConfigPatchesJSON6902:
- group: kubeadm.k8s.io
  version: v1beta3
  kind: ClusterConfiguration
  patch: |
    - op: add
      path: /apiServer/certSANs/-
      value: my-hostname
# 1 control plane node and 5 workers
nodes:
# the control plane node config
- role: control-plane
  extraMounts:
    - hostPath: /tmp
      containerPath: /data
  kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "ingress-ready=true"
  extraPortMappings:
  - containerPort: 30007
    hostPort: 30007
  - containerPort: 30008
    hostPort: 30008
  - containerPort: 80
    hostPort: 80
    protocol: TCP
  - containerPort: 443
    hostPort: 443
    protocol: TCP
# worker 1: labeled app=mysql, tainted with app=mysql:NoSchedule
- role: worker
  extraMounts:
    - hostPath: /tmp
      containerPath: /data
  labels:
    app: mysql
  kubeadmConfigPatches:
  - |
    kind: JoinConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        taints:
        - key: "app"
          value: "mysql"
          effect: NoSchedule
# worker 2: labeled app=mysql, tainted with app=mysql:NoSchedule
- role: worker
  extraMounts:
    - hostPath: /tmp
      containerPath: /data
  labels:
    app: mysql
  kubeadmConfigPatches:
  - |
    kind: JoinConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        taints:
        - key: "app"
          value: "mysql"
          effect: NoSchedule
# worker 3: labeled app=todoapp
- role: worker
  extraMounts:
    - hostPath: /tmp
      containerPath: /data
  labels:
    app: todoapp
# worker 4: labeled app=todoapp
- role: worker
  extraMounts:
    - hostPath: /tmp
      containerPath: /data
  labels:
    app: todoapp
# worker 5: labeled app=todoapp
- role: worker
  extraMounts:
    - hostPath: /tmp
      containerPath: /data
  labels:
    app: todoapp
# worker 6: no labels, no taints (general purpose)
- role: worker
  extraMounts:
    - hostPath: /tmp
      containerPath: /data
