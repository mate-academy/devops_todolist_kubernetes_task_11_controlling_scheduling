apiVersion: apps/v1
kind: Deployment
metadata:
  name: todoapp-deployment
  namespace: mateapp
  labels:
    app: todolist
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: todolist
  template:
    metadata:
      labels:
        app: todolist
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 1
            preference:
              matchExpressions:
              - key: app
                operator: In
                values:
                - todoapp

        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - todolist
            topologyKey: "kubernetes.io/hostname"

      containers:
      - name: todoapp
        image: d4vp/todoapp:4.0.0
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        - name: DEBUG
          value: "True"
        - name: ALLOWED_HOSTS
          value: "*"
        - name: PYTHONUNBUFFERED
          valueFrom:
            configMapKeyRef:
              name: todo-config
              key: PYTHONUNBUFFERED
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: todo-secret
              key: SECRET_KEY
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: mysql-app-credentials
              key: NAME
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: mysql-app-credentials
              key: USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-app-credentials
              key: PASSWORD
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: mysql-app-credentials
              key: HOST
        - name: DB_PORT
          value: "3306"

        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"

        volumeMounts:
        - name: todo-storage
          mountPath: /app/data
        - name: config-volume
          mountPath: /app/configs
          readOnly: true
        - name: secret-volume
          mountPath: /app/secrets
          readOnly: true

        livenessProbe:
          httpGet:
            path: /api/liveness/
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/ready/
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10

      volumes:
      - name: todo-storage
        persistentVolumeClaim:
          claimName: todo-pvc
      - name: config-volume
        configMap:
          name: todo-config
      - name: secret-volume
        secret:
          secretName: todo-secret