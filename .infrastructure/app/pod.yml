apiVersion: v1
kind: Pod
metadata:
  name: todoapp-pod
  namespace: todoapp
  labels:
    app: todoapp
spec:
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 1
        preference:
          matchExpressions:
          - key: app
            operator: In
            values:
            - todoapp
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
          - key: app
            operator: In
            values:
            - todoapp
        topologyKey: "kubernetes.io/hostname"
  containers:
  - name: todoapp
    image: ikulyk404/todoapp:4.0.1
    resources:
      requests:
        memory: "256Mi"
        cpu: "150m"
      limits:
        memory: "256Mi"
        cpu: "150m"
    env:
    - name: PYTHONUNBUFFERED
      valueFrom:
        configMapKeyRef:
          name: app-config
          key: PYTHONUNBUFFERED
    - name: SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: app-secret
          key: SECRET_KEY
    ports:
    - containerPort: 8080