apiVersion: v1
kind: Pod
metadata:
  name: todoapp-pod-1
  namespace: todoapp
  labels:
    app: todoapp
spec:

  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: "app"
                operator: In
                values:
                  - "todoapp"
  containers:
    - name: todoapp
      image: todoapp:latest
      ports:
        - containerPort: 80